{% extends 'etudiants/base.html' %}
{% block title %}Supprimer {{ etudiant }}{% endblock %}

{% block content %}
<div class="card shadow-sm border-danger mx-auto" style="max-width: 600px;">
    <div class="card-body text-center">
        <h1 class="h4">Confirmer la suppression</h1>
        <p class="my-3">Voulez-vous vraiment supprimer <strong>{{ etudiant }}</strong> ? Cette action est irréversible.</p>
        <form method="post" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, supprimer</button>
            <a href="{% url 'detail_etudiant' etudiant.pk %}" class="btn btn-outline-primary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
