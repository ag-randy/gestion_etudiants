<h1>{{ etudiant.prenom }} {{ etudiant.nom }}</h1>

<p><strong>Nom :</strong> {{ etudiant.nom }}</p>
<p><strong>Prénom :</strong> {{ etudiant.prenom }}</p>
<p><strong>Programme :</strong> {{ etudiant.programme }}</p>
<p><strong>Remarque :</strong> {{ etudiant.remarque|default:"Aucune remarque" }}</p>
<p><strong>Date d'inscription :</strong> {{ etudiant.date_inscription }}</p>

<a href="{% url 'liste_etudiants' %}">Retour à la liste</a>
<a href="{% url 'etudiant_update' etudiant.pk %}">Modifier</a>
<a href="{% url 'etudiant_delete' etudiant.pk %}">Supprimer</a>
