<h1> {%if etudiant %}Modifier{% else %}Ajouter un étudiant{% endif %}</h1>

{% if messages %}
    <ul>
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Ajouter</button>
</form>
<a href="{% url 'liste_etudiants' %}">Retour à la liste</a>
